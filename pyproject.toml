[project]
name = "tcga-multimodal-text-lab"
version = "0.1.0"
description = "Patient-matched pathology-report text + RNA + clinical survival ablation on public TCGA-BRCA data"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2,<3",
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  "transformers>=4.46,<5",
  "lifelines>=0.30,<1",
  "openpyxl>=3.1,<4",
  "requests>=2.32,<3",
  "psutil>=6,<8",
  "scikit-survival>=0.23",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
